  <style>
:root {
  --bg: #0b1220;
  --bg-2: #0f172a;
  --card: #131c2e;
  --card-2: #182338;
  --line: #22304a;
  --text: #e6ecf5;
  --muted: #8a99b3;
  --faint: #5d6b85;
  --brand: #38bdf8;
  --brand-2: #0ea5e9;
  --ok: #34d399;
  --warn: #fbbf24;
  --info: #818cf8;
  --orange: #fb923c;
  --danger: #f87171;
  --radius: 16px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
body { min-height: 100dvh; }
button, input, textarea, select { font: inherit; color: inherit; }
a { color: var(--brand); text-decoration: none; }
.hidden { display: none !important; }

/* ---------- auth ---------- */
.auth { min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
  background: radial-gradient(900px 500px at 10% -10%, #0c4a6e55, transparent), radial-gradient(700px 400px at 110% 110%, #312e8155, transparent), var(--bg); }
.auth-card { width: 100%; max-width: 400px; }
.logo { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
.logo-mark { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center;
  background: linear-gradient(135deg, var(--brand), #6366f1); box-shadow: 0 8px 24px #38bdf833; }
.logo-mark svg { width: 24px; height: 24px; }
.logo h1 { font-size: 22px; margin: 0; letter-spacing: -.02em; }
.logo p { margin: 0; color: var(--muted); font-size: 13px; }
.tabs { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px; padding: 4px; margin-bottom: 20px; }
.tabs button { border: 0; background: none; padding: 10px; border-radius: 9px; color: var(--muted); font-weight: 600; cursor: pointer; }
.tabs button.on { background: var(--card-2); color: var(--text); box-shadow: 0 1px 0 #ffffff0d inset; }

/* ---------- forms ---------- */
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
.input, .textarea, .select { width: 100%; background: var(--bg-2); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px; outline: none; transition: border-color .15s, box-shadow .15s; font-size: 16px; }
.textarea { min-height: 84px; resize: vertical; }
.input:focus, .textarea:focus, .select:focus { border-color: var(--brand-2); box-shadow: 0 0 0 3px #0ea5e933; }
.input::placeholder, .textarea::placeholder { color: var(--faint); }
.input-icon { position: relative; }
.input-icon svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--faint); pointer-events: none; }
.input-icon .input { padding-left: 40px; }
.chips-pick { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chips-pick button { border: 1px solid var(--line); background: var(--bg-2); color: var(--muted); border-radius: 999px; padding: 5px 11px; font-size: 13px; cursor: pointer; }
.chips-pick button:active { background: var(--card-2); }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px;
  padding: 13px 18px; font-weight: 600; cursor: pointer; transition: transform .05s, filter .15s, opacity .15s; white-space: nowrap; }
.btn:active { transform: scale(.98); }
.btn:disabled { opacity: .55; pointer-events: none; }
.btn svg { width: 18px; height: 18px; }
.btn-primary { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #04263a; }
.btn-ok { background: var(--ok); color: #053023; }
.btn-warn { background: var(--warn); color: #3b2a02; }
.btn-info { background: var(--info); color: #14164a; }
.btn-ghost { background: var(--card-2); color: var(--text); border: 1px solid var(--line); }
.btn-danger { background: #f8717122; color: var(--danger); border: 1px solid #f8717144; }
.btn-block { width: 100%; }
.btn-sm { padding: 8px 12px; font-size: 13.5px; border-radius: 10px; }
.err { color: var(--danger); font-size: 13.5px; min-height: 20px; margin: 4px 0 8px; }
.note { color: var(--muted); font-size: 13px; }

/* ---------- shell ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 12px; padding: 12px 16px;
  padding-top: max(12px, env(safe-area-inset-top)); background: #0b1220e6; backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.topbar .logo-mark { width: 34px; height: 34px; border-radius: 10px; }
.topbar .logo-mark svg { width: 18px; height: 18px; }
.topbar h2 { font-size: 17px; margin: 0; flex: 1; letter-spacing: -.01em; }
.avatar { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 14px;
  background: #38bdf822; color: var(--brand); border: 1px solid #38bdf844; cursor: pointer; }
.icon-btn { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; background: var(--card-2); border: 1px solid var(--line); cursor: pointer; }
.icon-btn svg { width: 18px; height: 18px; }
main { max-width: 760px; margin: 0 auto; padding: 16px 16px calc(96px + var(--safe-b)); }

.bottomnav { position: fixed; z-index: 30; left: 0; right: 0; bottom: 0; display: flex; justify-content: space-around; align-items: center;
  background: #0f172af2; backdrop-filter: blur(12px); border-top: 1px solid var(--line); padding: 8px 8px calc(8px + var(--safe-b)); }
.bottomnav button { flex: 1; border: 0; background: none; color: var(--faint); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 600; padding: 4px; cursor: pointer; }
.bottomnav button svg { width: 22px; height: 22px; }
.bottomnav button.on { color: var(--brand); }
.bottomnav .fab { flex: 0 0 auto; width: 56px; height: 56px; margin-top: -26px; border-radius: 18px; color: #04263a;
  background: linear-gradient(135deg, var(--brand), #6366f1); box-shadow: 0 10px 24px #0ea5e955; display: grid; place-items: center; }
.bottomnav .fab svg { width: 26px; height: 26px; }
.badge-dot { position: relative; }
.badge-dot[data-n]::after { content: attr(data-n); position: absolute; top: -2px; right: calc(50% - 20px); background: var(--danger); color: #fff; font-size: 10px; border-radius: 99px; padding: 0 5px; line-height: 16px; }

/* ---------- stats & filters ---------- */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 14px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 10px 10px 9px; cursor: pointer; text-align: left; }
.stat b { display: block; font-size: 20px; letter-spacing: -.02em; }
.stat span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.stat.on { border-color: var(--brand-2); background: #0ea5e914; }
.stat .bar { height: 3px; border-radius: 3px; margin-bottom: 7px; width: 22px; }

.toolbar { display: flex; gap: 8px; margin-bottom: 10px; }
.toolbar .input-icon { flex: 1; }
.datebar { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 14px; scrollbar-width: none; }
.datebar::-webkit-scrollbar { display: none; }
.pill { border: 1px solid var(--line); background: var(--card); color: var(--muted); padding: 7px 13px; border-radius: 999px; font-weight: 600; font-size: 13px; white-space: nowrap; cursor: pointer; }
.pill.on { background: var(--text); color: var(--bg); border-color: var(--text); }
.pill-date { position: relative; }
.pill-date input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

/* ---------- ticket cards ---------- */
.list { display: grid; gap: 10px; }
.group-h { font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint); margin: 10px 2px 2px; }
.tcard { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; cursor: pointer; position: relative; overflow: hidden; transition: border-color .15s; }
.tcard:active { border-color: #38bdf866; }
.tcard::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--c, var(--line)); }
.tcard-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.tid { font-size: 12px; color: var(--faint); font-weight: 600; }
.tcard h3 { margin: 0; font-size: 16px; letter-spacing: -.01em; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tcard .addr { color: var(--muted); font-size: 13.5px; margin: 0 0 8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.issue { display: inline-block; font-size: 13px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 8px; padding: 3px 8px; margin-bottom: 10px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12.5px; color: var(--muted); }
.meta span { display: inline-flex; align-items: center; gap: 5px; }
.meta svg { width: 14px; height: 14px; color: var(--faint); }
.remarks { margin-top: 10px; font-size: 13px; color: var(--ok); background: #34d39912; border: 1px solid #34d39930; border-radius: 8px; padding: 6px 9px; }

.status { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase;
  padding: 4px 9px; border-radius: 999px; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); border: 1px solid color-mix(in srgb, var(--c) 30%, transparent); white-space: nowrap; }
.status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.s-open { --c: var(--danger); }
.s-assigned { --c: var(--orange); }
.s-on_site { --c: var(--info); }
.s-in_progress { --c: var(--warn); }
.s-closed { --c: var(--ok); }

.empty { text-align: center; color: var(--muted); padding: 48px 16px; }
.empty svg { width: 46px; height: 46px; color: var(--faint); margin-bottom: 8px; }
.skeleton { height: 118px; border-radius: var(--radius); background: linear-gradient(90deg, var(--card) 25%, var(--card-2) 50%, var(--card) 75%); background-size: 200% 100%; animation: sh 1.2s infinite; }
@keyframes sh { to { background-position: -200% 0; } }

/* ---------- detail ---------- */
.back { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); background: none; border: 0; padding: 4px 0; margin-bottom: 10px; cursor: pointer; font-weight: 600; }
.back svg { width: 18px; height: 18px; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 12px; }
.panel h4 { margin: 0 0 12px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; align-items: center; justify-content: space-between; }
.dhead { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 4px; }
.dhead h1 { margin: 0; font-size: 22px; letter-spacing: -.02em; flex: 1; }
.kv { display: grid; grid-template-columns: 28px 1fr; gap: 12px 6px; align-items: start; margin-top: 14px; }
.kv svg { width: 18px; height: 18px; color: var(--faint); margin-top: 2px; }
.kv .v { font-size: 15px; }
.kv .v small { display: block; color: var(--muted); font-size: 12px; }
.quick { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 14px; }
.quick .btn { padding: 9px 4px; gap: 5px; font-size: 12.5px; flex-direction: column; }

/* progress stepper */
.steps { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; position: relative; }
.step { text-align: center; position: relative; }
.step .dot { width: 30px; height: 30px; margin: 0 auto 6px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); border: 2px solid var(--line); color: var(--faint); position: relative; z-index: 1; }
.step .dot svg { width: 15px; height: 15px; }
.step.done .dot { background: var(--ok); border-color: var(--ok); color: #053023; }
.step.cur .dot { border-color: var(--brand); color: var(--brand); box-shadow: 0 0 0 4px #38bdf822; }
.step:not(:last-child)::after { content: ""; position: absolute; top: 14px; left: calc(50% + 15px); right: calc(-50% + 15px); height: 2px; background: var(--line); }
.step.done:not(:last-child)::after { background: var(--ok); }
.step b { display: block; font-size: 12px; }
.step small { display: block; font-size: 11px; color: var(--muted); min-height: 15px; }
.actionbox { margin-top: 16px; display: grid; gap: 8px; }

/* timeline */
.tl { list-style: none; margin: 0; padding: 0; }
.tl li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; position: relative; padding-bottom: 14px; }
.tl li:not(:last-child)::before { content: ""; position: absolute; left: 13px; top: 28px; bottom: 0; width: 2px; background: var(--line); }
.tl .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--bg-2); border: 1px solid var(--line); color: var(--c, var(--muted)); }
.tl .ic svg { width: 14px; height: 14px; }
.tl .what { font-size: 14px; }
.tl .what b { font-weight: 600; }
.tl .when { font-size: 12px; color: var(--muted); }
.tl .txt { font-size: 13.5px; color: var(--muted); margin-top: 3px; white-space: pre-wrap; word-break: break-word; }

/* photos */
.photos { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.photos .ph { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--bg-2); border: 1px solid var(--line); cursor: pointer; position: relative; }
.photos img { width: 100%; height: 100%; object-fit: cover; display: block; }
.photos .add { display: grid; place-items: center; color: var(--muted); font-size: 12px; font-weight: 600; text-align: center; border-style: dashed; }
.photos .add svg { width: 24px; height: 24px; margin: 0 auto 4px; display: block; }
.photos .add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: #000e; display: grid; place-items: center; padding: 16px; }
.lightbox img { max-width: 100%; max-height: 80dvh; border-radius: 10px; }
.lightbox .cap { color: #cbd5e1; font-size: 13px; text-align: center; margin-top: 10px; }
.lightbox .row { display: flex; gap: 8px; justify-content: center; margin-top: 12px; }

/* sheet */
.backdrop { position: fixed; inset: 0; z-index: 50; background: #020617b3; display: flex; align-items: flex-end; justify-content: center; animation: fade .15s; }
.sheet { width: 100%; max-width: 560px; max-height: 92dvh; overflow: auto; background: var(--card); border: 1px solid var(--line); border-bottom: 0;
  border-radius: 22px 22px 0 0; padding: 10px 18px calc(18px + var(--safe-b)); animation: up .2s ease-out; }
.sheet .grab { width: 40px; height: 4px; border-radius: 4px; background: var(--line); margin: 0 auto 12px; }
.sheet h3 { margin: 0 0 4px; font-size: 19px; }
.sheet .sub { color: var(--muted); font-size: 13.5px; margin: 0 0 16px; }
@media (min-width: 640px) { .backdrop { align-items: center; } .sheet { border-radius: 22px; border-bottom: 1px solid var(--line); } }
@keyframes up { from { transform: translateY(30px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* users */
.urow { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.urow:last-child { border-bottom: 0; }
.urow .who { flex: 1; min-width: 0; }
.urow .who b { display: block; }
.urow .who small { color: var(--muted); }
.urow .select { width: auto; padding: 8px 10px; font-size: 14px; }
.tag { font-size: 11px; font-weight: 700; padding: 2px 7px; border-radius: 6px; background: #fbbf2422; color: var(--warn); margin-left: 6px; text-transform: uppercase; }

#toast { position: fixed; left: 50%; bottom: calc(92px + var(--safe-b)); transform: translate(-50%, 20px); opacity: 0; z-index: 70; pointer-events: none;
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; transition: .2s; max-width: calc(100% - 32px); text-align: center; }
#toast.show { opacity: 1; transform: translate(-50%, 0); }
#toast.bad { background: var(--danger); color: #fff; }

.lang-btn { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 999px; padding: 7px 14px; font-weight: 600; font-size: 14px; cursor: pointer; }
:lang(ta) body { font-family: Inter, 'Noto Sans Tamil', system-ui, sans-serif; }
:lang(ta) .status { letter-spacing: 0; }

/* ---------- update 2 ---------- */
.logo-mark.img { background: #fff; box-shadow: 0 6px 18px #0006; padding: 3px; overflow: hidden; }
.logo-mark.img img { width: 100%; height: 100%; object-fit: contain; display: block; }
.brand-badge { background: #fff; border-radius: 16px; padding: 14px 18px; display: flex; justify-content: center; margin-bottom: 14px; box-shadow: 0 10px 30px #0005; }
.brand-badge img { width: 100%; max-width: 280px; height: auto; display: block; }
.brand-sub { text-align: center; margin: 0 0 22px; color: var(--muted); font-size: 13.5px; }
.brand-sub b { color: var(--text); font-size: 16px; display: block; letter-spacing: -.01em; }
.pw-wrap .input { padding-right: 46px; }
.pw-eye { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 40px; height: 40px; border: 0; background: none; color: var(--muted); display: grid; place-items: center; cursor: pointer; border-radius: 10px; }
.pw-eye svg { position: static; transform: none; width: 20px; height: 20px; color: inherit; pointer-events: none; }
.caps { color: var(--warn); font-size: 12.5px; margin-top: 5px; display: none; }
.caps.on { display: block; }
.pv { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 8px; }
.pv:empty { display: none; }
.pv .ph { aspect-ratio: 1; border-radius: 10px; overflow: hidden; position: relative; background: var(--bg-2); border: 1px solid var(--line); }
.pv img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pv .x { position: absolute; top: 4px; right: 4px; width: 30px; height: 30px; border-radius: 50%; border: 0; background: #000b; color: #fff; font-size: 17px; line-height: 30px; text-align: center; cursor: pointer; padding: 0; }
.pv .busy { display: grid; place-items: center; color: var(--muted); font-size: 12px; height: 100%; }
.card-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.card-acts .btn { padding: 10px 6px; font-size: 14px; gap: 6px; }
.age { font-weight: 700; color: var(--muted); }
.age.late { color: var(--danger); }
.warnbox { background: #fbbf2414; border: 1px solid #fbbf2440; color: var(--warn); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin-top: 6px; }
.warnbox a { color: var(--warn); text-decoration: underline; font-weight: 700; }
#offline { position: fixed; left: 0; right: 0; top: 0; z-index: 80; background: var(--danger); color: #fff; text-align: center; font-weight: 600; font-size: 13.5px; padding: calc(6px + env(safe-area-inset-top)) 12px 6px; transform: translateY(-110%); transition: transform .2s; }
#offline.on { transform: none; }
#ptr { height: 0; overflow: hidden; display: grid; place-items: center; color: var(--muted); font-size: 13px; transition: height .15s; }
#ptr svg { width: 18px; height: 18px; margin-right: 6px; vertical-align: -4px; }
.lightbox.full { padding: 0; display: block; overflow: auto; }
.lightbox.full .lb-img { min-height: calc(100dvh - 120px); display: grid; place-items: center; overflow: auto; touch-action: pan-x pan-y pinch-zoom; }
.lightbox.full img { max-width: 100%; max-height: calc(100dvh - 120px); border-radius: 0; cursor: zoom-in; }
.lightbox.full.zoom img { max-width: none; max-height: none; width: 250%; cursor: zoom-out; }
.lightbox.full .lb-bar { position: sticky; bottom: 0; left: 0; padding: 10px 12px calc(10px + var(--safe-b)); background: #000c; }
.usage { height: 10px; background: var(--bg-2); border: 1px solid var(--line); border-radius: 99px; overflow: hidden; margin: 8px 0 6px; }
.usage > div { height: 100%; background: var(--ok); }
.usage.mid > div { background: var(--warn); }
.usage.high > div { background: var(--danger); }
.sms-row { display: grid; gap: 8px; }
.track { max-width: 520px; margin: 0 auto; padding: 20px 16px 40px; }
.track .steps { margin: 18px 0 8px; }
.track .big { font-size: 20px; font-weight: 700; margin: 6px 0 2px; }
.lightbox.full.zoom .lb-img { display: block; }

/* ---------- layout safety for long (Tamil) labels ---------- */
html, body { overflow-x: hidden; }
.stats { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.stat span { display: block; overflow-wrap: break-word; line-height: 1.25; }
.steps { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.step b, .step small { overflow-wrap: break-word; line-height: 1.25; }
.bottomnav button { min-width: 0; text-align: center; line-height: 1.15; overflow-wrap: break-word; }
.btn { max-width: 100%; }
.sheet { max-width: min(560px, 100%); }
.sheet .btn-block, .actionbox .btn, .sms-row .btn { white-space: normal; text-align: center; line-height: 1.3; }
:lang(ta) .btn { white-space: normal; text-align: center; line-height: 1.3; }
:lang(ta) .bottomnav button { font-size: 9.5px; letter-spacing: -.01em; }
:lang(ta) .stat span { font-size: 10.5px; }
:lang(ta) .step b { font-size: 10px; }
:lang(ta) .steps { gap: 2px; }
:lang(ta) .pill { font-size: 12.5px; }
:lang(ta) .sheet h3 { font-size: 17px; }
:lang(ta) .panel h4 { letter-spacing: 0; }
:lang(ta) .quick .btn { font-size: 12px; }
.sms-or { text-align: center; color: var(--muted); font-size: 12.5px; margin: 4px 0 0; }
.btn-next { animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px #34d39944; } }

</style>

  if (isManager()) prunePhotos();
}

function render() {
  closeSheet();

  if (page === 'track' && id) return renderTrack(id);
  if (!state.user) return renderAuth();
  if (page === 't' && id) return renderDetail(Number(id));

// show/hide eye + Caps Lock warning on every password box
function pwEnhance(root = document) {
  root.querySelectorAll('input[type=password]:not([data-pw])').forEach((inp) => {
    inp.dataset.pw = '1';
    const wrap = inp.closest('.input-icon') || inp.parentElement; wrap.classList.add('pw-wrap');
    const b = document.createElement('button'); b.type = 'button'; b.className = 'pw-eye'; b.setAttribute('aria-label', 'Show password'); b.innerHTML = icon('eye');
    b.onclick = () => { const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; b.innerHTML = icon(show ? 'eyeoff' : 'eye'); b.setAttribute('aria-label', show ? 'Hide password' : 'Show password'); inp.focus(); };
    wrap.appendChild(b);
    const caps = document.createElement('div'); caps.className = 'caps'; caps.textContent = 'Caps Lock is on'; wrap.after(caps);
    const chk = (e) => { if (e.getModifierState) caps.classList.toggle('on', e.getModifierState('CapsLock')); };
    inp.addEventListener('keydown', chk); inp.addEventListener('keyup', chk); inp.addEventListener('blur', () => caps.classList.remove('on'));
  });
}

// ---------- list ----------
function dayRange(day) {
  const d = new Date(); d.setHours(0, 0, 0, 0);
  if (day === 'all') return {};
  if (day === 'today') return { from: d.toISOString(), to: new Date(+d + 864e5).toISOString() };
  if (day === 'yesterday') return { from: new Date(+d - 864e5).toISOString(), to: d.toISOString() };
  if (day === 'week') return { from: new Date(+d - 6 * 864e5).toISOString(), to: new Date(+d + 864e5).toISOString() };
  const [y, m, dd] = day.split('-').map(Number); const s = new Date(y, m - 1, dd);
  return { from: s.toISOString(), to: new Date(+s + 864e5).toISOString() };
}

const telNum = (m) => String(m).replace(/[^\d+]/g, '');
const waNum = (m) => { const d = String(m).replace(/\D/g, ''); return d.length === 10 ? '91' + d : d; };
// real phones: tel: link opens the dialer. Claude preview blocks tel:, so the demo shows a sheet instead.
const callLink = (m, cls) => window.DEMO?.isDemo ? `<button type="button" class="${cls}" data-stop data-call="${esc(m)}">${icon('phone')}Call</button>` : `<a class="${cls}" data-stop href="tel:${esc(telNum(m))}">${icon('phone')}Call</a>`;
const isIOS = () => /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const smsHref = (num, body) => `sms:${telNum(num)}${isIOS() ? '&' : '?'}body=${encodeURIComponent(body)}`;
const appUrl = () => location.origin + location.pathname;
const trackUrl = (t) => (t.track_token ? `${appUrl()}?${t.track_token}` : '');
const bare = (u) => u.replace(/^https?:\/\//, ''); // phones still make it a tappable link
// Keep each SMS to one part (160 plain characters): shorten the long fields until it fits
const SMS_MAX = 160;
const cut = (v, n) => { v = String(v || '').replace(/\s+/g, ' ').trim(); return v.length > n ? v.slice(0, Math.max(1, n - 1)).trimEnd() + '.' : v; };
function fitSms(build, fields) {
  const len = Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, String(v || '').length]));
  for (let guard = 0; guard < 400; guard++) {
    const txt = build(Object.fromEntries(Object.entries(fields).map(([k, v]) => [k, cut(v, len[k])])));
    if (txt.length <= SMS_MAX) return txt;
    const k = Object.keys(len).filter((x) => len[x] > 4).sort((a, z) => len[z] - len[a])[0];
    if (!k) return txt; len[k] -= 1;
  }
  return build(fields);
}
function customerSms(t, eng) {
  const tr = trackUrl(t); const ph = eng?.phone ? String(eng.phone).replace(/\s/g, '') : '';
  return fitSms((f) => `${BRAND}: Complaint registered. Ticket #${t.id} (${f.issue}).` +
    (eng ? ` Engineer: ${f.name}${ph ? ' ' + ph : ''}.` : ' Our engineer will call you soon.') +
    (tr ? ` Track: ${bare(tr)}` : ''), { issue: t.issue, name: (eng?.name || '').split(' ')[0] });
}
const engineerSms = (t) => fitSms((f) => `New ticket #${t.id}\n${f.customer}\nMob: ${String(t.mobile).replace(/\s/g, '')}\n${f.address}\nIssue: ${f.issue}\n${bare(appUrl())}#/t/${t.id}`,
  { customer: t.customer, address: t.address, issue: t.issue });
async function engineerOf(t) {
  if (!t.assigned_to) return null;
  try { return (await api('/api/users')).users.find((u) => u.id == t.assigned_to) || null; } catch { return null; }
}
function smsSheet(t, eng, title) {
  openSheet(`<h3>${esc(title || 'Send SMS')}</h3><p class="sub">Tap a button: Messages opens with the text ready, then press Send. It goes from your own SIM.</p>
    <div class="sms-row">
      ${eng?.phone ? `<button class="btn btn-ok btn-block" id="sms-both">${icon('sms')}Send both SMS</button><p class="sms-or">or send one at a time</p>` : ''}
      <a class="btn btn-primary btn-block" href="${smsHref(t.mobile, customerSms(t, eng))}">${icon('sms')}SMS customer · ${esc(t.mobile)}</a>
      ${eng ? (eng.phone ? `<a class="btn btn-info btn-block" href="${smsHref(eng.phone, engineerSms(t))}">${icon('sms')}SMS engineer · ${esc(eng.name)}</a>` : `<p class="note">${esc(eng.name)} has no mobile number saved, so no SMS to the engineer.</p>`) : '<p class="note">No engineer assigned yet. Assign one to send the job by SMS.</p>'}
      ${trackUrl(t) ? `<button class="btn btn-ghost btn-block" id="cp-track">${icon('nav')}Copy tracking link</button>` : ''}
      <button class="btn btn-ghost btn-block" id="sms-done">Done</button>
    </div>`);
  $('#sms-done').onclick = closeSheet;
  // One button for both: opens Messages for the customer; when you come back it opens the field engineer's SMS
  const both = $('#sms-both');
  if (both) {
    const custH = smsHref(t.mobile, customerSms(t, eng)), engH = smsHref(eng.phone, engineerSms(t));
    let stage = 0;
    const toEngineer = () => {
      if (stage !== 1 || !document.contains(both)) return;
      stage = 2; location.href = engH;
      both.className = 'btn btn-ghost btn-block'; both.innerHTML = `${icon('check')}Both SMS opened`;
    };
    both.onclick = () => {

        stage = 1; location.href = custH;
        both.className = 'btn btn-ok btn-block btn-next'; both.innerHTML = `${icon('sms')}Next: SMS field engineer`;
      } else if (stage === 1) toEngineer();

    };
    const onBack = () => { if (!document.contains(both)) return document.removeEventListener('visibilitychange', onBack); if (document.visibilityState === 'visible') setTimeout(toEngineer, 700); };
    document.addEventListener('visibilitychange', onBack);
  }
  if ($('#cp-track')) $('#cp-track').onclick = async () => toast((await copyText(trackUrl(t))) ? 'Tracking link copied' : trackUrl(t));
}
function copyText(txt) {
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch {} ta.remove(); return ok; };
  return (navigator.clipboard ? navigator.clipboard.writeText(txt).then(() => true, fallback) : Promise.resolve(fallback()));
}
function openCall(mobile) {

function getPosition() {
  return new Promise((res) => {
    if (!navigator.geolocation) return res(null);
    navigator.geolocation.getCurrentPosition((p) => res({ lat: p.coords.latitude, lng: p.coords.longitude }), () => res(null), { enableHighAccuracy: true, timeout: 8000, maximumAge: 60000 });
  });
}

}

async function doAction(t, a, btn) {
  try {
    if (a === 'arrive' || a === 'start') {
      btn.disabled = true; btn.innerHTML = `${icon('clock')}Saving…`;
      const pos = a === 'arrive' ? await getPosition() : null;
      await act(t.id, { action: a, ...(pos || {}) });
      toast(a === 'arrive' ? `Arrival marked at ${fmtTime(new Date().toISOString())}` : 'Work started');
    } else if (a === 'close') {
      closeSheetUI(t);
    } else if (a === 'reopen') {
      promptSheet('Reopen ticket', 'Why is it being reopened?', 'e.g. Customer called again, still no signal', 'Reopen', (note) => act(t.id, { action: 'reopen', note }), true);
    } else if (a === 'take') {
      await act(t.id, { action: 'take' }); toast('Job assigned to you');
    } else if (a === 'assign') {
      const { users } = await api('/api/users');
      const eng = users.filter((u) => u.status === 'active');

// Only accept photos taken just now with the camera (blocks old gallery pictures)
function freshOnly(list) {
  const ok = [...list].filter((f) => !f.lastModified || Date.now() - f.lastModified < 10 * 60e3);
  if (ok.length < list.length) toast('Only new camera photos are allowed', true);
  return ok;

// ---------- photo stamp + preview ----------
let lastPos = null, lastPosAt = 0;
async function stampPos() {
  if (lastPos && Date.now() - lastPosAt < 120e3) return lastPos;
  const p = await getPosition(); if (p) { lastPos = p; lastPosAt = Date.now(); }
  return p;
}
// Burns date/time, ticket number and GPS into the bottom of the photo
function stampPhoto(file, label, pos) {
  return new Promise((resolve) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600; const s = Math.min(1, max / Math.max(img.width, img.height));
      const w = Math.round(img.width * s), h = Math.round(img.height * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h; const g = c.getContext('2d');
      g.drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      const fs = Math.max(14, Math.round(Math.min(w, h) / 30)); const pad = Math.round(fs * 0.6);
      const d = new Date();
      const l1 = `${d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })}, ${d.toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' })}${label ? '  ·  ' + label : ''}`;
      const l2 = pos ? `GPS ${pos.lat.toFixed(5)}, ${pos.lng.toFixed(5)}  ·  ${BRAND}` : `GPS not available  ·  ${BRAND}`;
      const bh = fs * 2 + pad * 3;
      g.fillStyle = 'rgba(0,0,0,.55)'; g.fillRect(0, h - bh, w, bh);
      g.fillStyle = '#fff'; g.font = `600 ${fs}px Inter, system-ui, sans-serif`; g.textBaseline = 'top';
      g.fillText(l1, pad, h - bh + pad, w - pad * 2);
      g.font = `${Math.round(fs * 0.85)}px Inter, system-ui, sans-serif`; g.fillStyle = '#e2e8f0';
      g.fillText(l2, pad, h - bh + pad * 2 + fs, w - pad * 2);
      c.toBlob((b) => resolve(b ? new File([b], 'photo.jpg', { type: 'image/jpeg', lastModified: Date.now() }) : file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}
// Camera button + thumbnails with ✕. Returns { files(), add(list) }
function photoPicker(el, label, max = 6) {
  const items = [];
  el.innerHTML = `<label class="btn btn-ghost btn-block" style="position:relative">${icon('camera')}<span class="pp-l">Take photo</span><input type="file" accept="image/*" capture="environment" style="position:absolute;inset:0;opacity:0"></label><div class="pv"></div>`;
  const inp = $('input', el), pv = $('.pv', el), lbl = $('.pp-l', el);
  const draw = () => {
    pv.innerHTML = items.map((it, i) => it.url ? `<div class="ph"><img src="${it.url}" alt=""><button type="button" class="x" data-x="${i}" aria-label="Remove photo">✕</button></div>` : '<div class="ph"><div class="busy">…</div></div>').join('');
    pv.querySelectorAll('[data-x]').forEach((b) => b.onclick = () => { const it = items.splice(Number(b.dataset.x), 1)[0]; URL.revokeObjectURL(it.url); draw(); });
    lbl.textContent = items.length ? `${items.length} photo(s) · tap for another` : 'Take photo';
  };
  const add = async (list) => {
    const fresh = freshOnly(list).slice(0, Math.max(0, max - items.length));
    if (!fresh.length) return;
    const slots = fresh.map(() => { const it = { file: null, url: '' }; items.push(it); return it; }); draw();
    const pos = await stampPos();
    for (let i = 0; i < fresh.length; i++) {
      const f = await stampPhoto(fresh[i], label, pos);
      slots[i].file = f; slots[i].url = URL.createObjectURL(f); draw();
    }
  };
  inp.onchange = () => { const l = [...inp.files]; inp.value = ''; add(l); };
  return { files: () => items.filter((x) => x.file).map((x) => x.file), add, busy: () => items.some((x) => !x.file) };
}

// compress big phone photos before upload (saves mobile data)
function compress(file) {
  return new Promise((resolve) => {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) return resolve(file);
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600; let { width: w, height: h } = img;
      if (w <= max && h <= max && file.size < 900e3) { URL.revokeObjectURL(url); return resolve(file); }
      const s = Math.min(1, max / Math.max(w, h)); w = Math.round(w * s); h = Math.round(h * s);
      const c = document.createElement('canvas'); c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h); URL.revokeObjectURL(url);
      c.toBlob((b) => resolve(b ? new File([b], file.name.replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.82);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(file); };
    img.src = url;
  });
}

async function uploadPhotos(id, files, silent, caption) {
  if (!files.length) return;
  if (!silent) toast(`Uploading ${files.length} photo(s)…`);
  const fd = new FormData();
  for (const f of files.slice(0, 6)) fd.append('photos', await compress(f));
  if (caption) fd.append('caption', caption);
  try {
    await api(`/api/tickets/${id}/photos`, { method: 'POST', body: fd });
    prunePhotos();
    if (!silent) { toast('Photo uploaded'); renderDetail(id); }
  } catch (e) { if (silent) throw e; toast(e.message, true); }
}

    <div><h3>${esc(u.name)}</h3><div class="note">@${esc(u.username)} · ${esc(roleName(u.role))}</div></div></div>
    ${isManager() && !window.DEMO ? `<a class="btn btn-ghost btn-block" style="margin-bottom:8px" href="/api/export.csv">${icon('dl')}Export all tickets (CSV / Excel)</a>` : ''}${isManager() && window.DEMO?.exportCsv ? `<button class="btn btn-ghost btn-block" style="margin-bottom:8px" id="exp">${icon('dl')}Export all tickets (CSV / Excel)</button>` : ''}
    ${window.I18N ? `<div style="margin-bottom:8px">${I18N.button().replace('class="lang-btn"', 'class="btn btn-ghost btn-block"')}</div>` : ''}
    <button class="btn btn-ghost btn-block" style="margin-bottom:8px" id="chpw">${icon('lock')}Change password</button>
    <button class="btn btn-danger btn-block" id="lo">${icon('logout')}Log out</button>`);
  $('#chpw').onclick = () => passwordSheet('Change password', 'Enter your new password.', (pw) => api('/api/password', { method: 'POST', body: { password: pw } }));
  if ($('#exp')) $('#exp').onclick = () => window.DEMO.exportCsv().catch((e) => toast(e.message, true));
  $('#lo').onclick = async () => { await api('/api/logout', { method: 'POST' }).catch(() => {}); state.user = null; location.hash = ''; render(); };
}

function passwordSheet(title, sub, fn) {
  openSheet(`<h3>${esc(title)}</h3><p class="sub">${esc(sub)}</p>
    <div class="field"><label for="pw1">New password</label><div class="input-icon">${icon('lock')}<input class="input" id="pw1" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div></div>
    <div class="field"><label for="pw2">Repeat new password</label><div class="input-icon">${icon('lock')}<input class="input" id="pw2" type="password" autocomplete="new-password"></div></div>
    <div class="err" id="pw-err"></div><button class="btn btn-primary btn-block" id="pw-go">Save password</button>`);
  $('#pw-go').onclick = async (e) => {
    const a = $('#pw1').value, b = $('#pw2').value;
    if (a.length < 6) { $('#pw-err').textContent = 'Password must be at least 6 characters'; return; }
    if (a !== b) { $('#pw-err').textContent = 'The two passwords do not match'; return; }
    e.target.disabled = true;
    try { await fn(a); closeSheet(); toast('Password changed'); } catch (err) { $('#pw-err').textContent = err.message; e.target.disabled = false; }
  };
}

function openForgot() {
  openSheet(`<h3>Forgot password</h3><p class="sub">Enter your username and the mobile number you registered with, then choose a new password.</p>
    <div class="field"><label for="fg-u">Username</label><div class="input-icon">${icon('user')}<input class="input" id="fg-u" autocapitalize="none" placeholder="e.g. kaja"></div></div>
    <div class="field"><label for="fg-m">Registered mobile number</label><div class="input-icon">${icon('phone')}<input class="input" id="fg-m" inputmode="tel" placeholder="e.g. 9876543210"></div></div>
    <div class="field"><label for="fg-p">New password</label><div class="input-icon">${icon('lock')}<input class="input" id="fg-p" type="password" autocomplete="new-password" placeholder="At least 6 characters"></div></div>
    <div class="err" id="fg-err"></div><button class="btn btn-primary btn-block" id="fg-go">Reset password</button>
    <p class="note" style="margin-top:12px">No mobile number on your account? Ask your admin to reset it from the Team page.</p>`);
  $('#fg-go').onclick = async (e) => {
    const body = { username: $('#fg-u').value, mobile: $('#fg-m').value, password: $('#fg-p').value };
    if (body.password.length < 6) { $('#fg-err').textContent = 'Password must be at least 6 characters'; return; }
    e.target.disabled = true;
    try {
      await api('/api/reset', { method: 'POST', body }); closeSheet(); toast('Password changed. Log in with the new password.');
      if ($('#f-user')) $('#f-user').value = body.username.trim().toLowerCase();
    } catch (err) { $('#fg-err').textContent = err.message; e.target.disabled = false; }
  };
}

// ---------- edit ticket ----------
function editSheet(t) {
  openSheet(`<h3>Edit ticket #${t.id}</h3><p class="sub">Fix a mistake. The change is recorded in the timeline.</p>
    <form id="ed" novalidate>
      <div class="field"><label for="ed-c">Customer name / User ID</label><div class="input-icon">${icon('user')}<input class="input" id="ed-c" name="customer" value="${esc(t.customer)}"></div></div>
      <div class="field"><label for="ed-a">Address / Location</label><div class="input-icon">${icon('pin')}<input class="input" id="ed-a" name="address" value="${esc(t.address)}"></div></div>
      <div class="field"><label for="ed-m">Mobile number</label><div class="input-icon">${icon('phone')}<input class="input" id="ed-m" name="mobile" inputmode="tel" value="${esc(t.mobile)}"></div></div>
      <div class="field"><label for="ed-i">Issue</label><div class="input-icon">${icon('alert')}<input class="input" id="ed-i" name="issue" value="${esc(t.issue)}"></div></div>
      <div class="err" id="ed-err"></div>
      <button class="btn btn-primary btn-block" type="submit">${icon('check')}Save changes</button>
    </form>`);
  $('#ed').onsubmit = async (e) => {
    e.preventDefault(); const btn = e.target.querySelector('[type=submit]'); btn.disabled = true;
    try { await api(`/api/tickets/${t.id}/edit`, { method: 'POST', body: Object.fromEntries(new FormData(e.target)) }); closeSheet(); toast('Ticket updated'); renderDetail(t.id); }
    catch (err) { $('#ed-err').textContent = err.message; btn.disabled = false; }
  };
}

// ---------- customer tracking page (no login) ----------
async function renderTrack(token) {
  $('#app').innerHTML = `<div class="track">
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">${window.I18N ? I18N.button() : ''}</div>
    <div class="brand-badge"><img src="${LOGO}" alt="${BRAND}"></div>
    <div id="tr-body"><div class="skeleton" style="height:220px"></div></div></div>`;
  let t;
  try { t = (await api('/api/track/' + encodeURIComponent(token))).ticket; }
  catch (e) { $('#tr-body').innerHTML = `<section class="panel"><div class="empty">${icon('alert')}<div>${esc(e.message)}</div></div></section>`; return; }
  const steps = [['Registered', t.created_at, 'ticket'], ['Engineer arrived', t.arrived_at, 'pin'], ['In progress', t.started_at, 'wrench'], ['Resolved', t.closed_at, 'flag']];
  const cur = steps.findIndex((x) => !x[1]);
  const label = { open: 'Registered', assigned: 'Engineer assigned', on_site: 'Engineer at your location', in_progress: 'Work in progress', closed: 'Resolved' }[t.status] || t.status;
  $('#tr-body').innerHTML = `<section class="panel">
      <div class="note">Ticket #${t.id}</div>
      <div class="big">${esc(label)}</div>
      <div class="note">${esc(t.issue)} · registered ${fmtDT(t.created_at)}</div>
      <div class="steps">${steps.map(([l, ts, ic], i) => `<div class="step ${ts ? 'done' : ''} ${i === cur ? 'cur' : ''}"><div class="dot">${icon(ts ? 'check' : ic)}</div><b>${l}</b><small>${ts ? fmtTime(ts) : ''}</small></div>`).join('')}</div>
    </section>
    ${t.engineer ? `<section class="panel"><h4>Your engineer</h4><div class="urow" style="border:0;padding:0"><div class="avatar">${esc(initials(t.engineer))}</div><div class="who"><b>${esc(t.engineer)}</b>${t.engineer_phone ? `<small>${esc(t.engineer_phone)}</small>` : ''}</div>${t.engineer_phone && t.status !== 'closed' ? callLink(t.engineer_phone, 'btn btn-ok btn-sm') : ''}</div></section>` : ''}
    <button class="btn btn-ghost btn-block" id="tr-ref">${icon('refresh')}Refresh</button>
    <p class="note" style="text-align:center;margin-top:14px">${BRAND}</p>`;
  $('#tr-ref').onclick = () => renderTrack(token);
  document.querySelectorAll('#tr-body [data-call]').forEach((b) => b.onclick = () => openCall(b.dataset.call));
}

// ---------- offline banner, auto-refresh, pull to refresh ----------
function setupOffline() {
  const bar = document.createElement('div'); bar.id = 'offline'; bar.textContent = 'No internet. Changes can’t be saved until the signal is back.';
  document.body.appendChild(bar);
  const upd = () => bar.classList.toggle('on', navigator.onLine === false);
  window.addEventListener('offline', upd);
  window.addEventListener('online', () => { upd(); toast('Back online'); if (state.user && route()[0] === 'tickets') loadList(); });
  upd();
}
const quiet = () => !$('#sheet-root').innerHTML && !document.querySelector('.lightbox') && document.activeElement?.id !== 'q';
function setupAutoRefresh() {
  const tick = () => { if (state.user && document.visibilityState === 'visible' && route()[0] === 'tickets' && quiet() && $('#list')) loadList(); };
  setInterval(tick, 60e3);
  document.addEventListener('visibilitychange', tick);
  // pull down from the top of the page to refresh
  let y0 = null, dy = 0;
  document.addEventListener('touchstart', (e) => { y0 = (window.scrollY <= 0 && state.user && quiet() && $('#ptr')) ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  document.addEventListener('touchmove', (e) => {
    if (y0 == null) return; dy = e.touches[0].clientY - y0; const p = $('#ptr'); if (!p) return;
    p.style.height = Math.max(0, Math.min(56, dy / 2.2)) + 'px';
    p.innerHTML = `<span>${icon('refresh')}${dy > 130 ? 'Release to refresh' : 'Pull to refresh'}</span>`;
  }, { passive: true });
  document.addEventListener('touchend', () => {
    const p = $('#ptr'); if (y0 == null || !p) return; y0 = null; p.style.height = '0';
    if (dy > 130) { const [page, id] = route(); if (page === 't' && id) renderDetail(Number(id)); else if ($('#list')) loadList(); toast('Refreshed'); }
  });
}

// ---------- photo storage limit (900 MB, oldest closed tickets first) ----------
let lastPrune = 0;
async function prunePhotos() {
  if (window.DEMO?.isDemo || Date.now() - lastPrune < 5 * 60e3) return;
  lastPrune = Date.now();
  try { await api('/api/storage/prune', { method: 'POST' }); } catch {}
}

// ---------- team ----------
async function renderUsers() {
  shell('Team', '<div class="skeleton"></div>', 'users');
  const { users } = await api('/api/users');
  const admin = state.user.role === 'admin';
  const pending = users.filter((u) => u.status === 'pending');
  const rest = users.filter((u) => u.status !== 'pending');
  const row = (u) => `<div class="urow">
      <div class="avatar">${esc(initials(u.name))}</div>
      <div class="who"><b>${esc(u.name)}${u.status === 'disabled' ? '<span class="tag">disabled</span>' : ''}</b><small>@${esc(u.username)}${u.phone ? ' · ' + esc(u.phone) : ''}</small></div>
      ${u.status === 'pending' && admin ? `<button class="btn btn-ok btn-sm" data-approve="${u.id}">Approve</button><button class="btn btn-danger btn-sm" data-reject="${u.id}">Reject</button>` :
        admin && u.id !== state.user.id ? `<select class="select" data-role="${u.id}">${['engineer', 'staff', 'admin'].map((r) => `<option ${u.role === r ? 'selected' : ''} value="${r}">${roleName(r)}</option>`).join('')}<option value="__disable">${u.status === 'disabled' ? 'enable' : 'disable'}</option><option value="__pw">reset password</option></select>` :
        `<span class="note">${esc(roleName(u.role))}</span>`}
    </div>`;
  $('#main').innerHTML = `
    ${pending.length ? `<section class="panel"><h4>Waiting for approval <span class="tag">${pending.length}</span></h4>${pending.map(row).join('')}</section>` : ''}
    <section class="panel"><h4>Team members</h4>${rest.map(row).join('')}</section>
    ${admin ? '<section class="panel" id="usage-box"><h4>Photo storage</h4><div class="note">Checking…</div></section>' : ''}
    <p class="note">Roles: <b>Field engineer</b> attends complaints and updates field jobs · <b>Office staff</b> logs and assigns tickets · <b>Admin</b> also approves accounts and deletes tickets.</p>`;
  if (admin) api('/api/storage').then((d) => {
    const mb = (b) => Math.round(b / 1048576); const pct = Math.min(100, (d.used / d.limit) * 100);
    $('#usage-box').innerHTML = `<h4>Photo storage <span style="text-transform:none;letter-spacing:0;font-weight:500">${mb(d.used)} MB of ${mb(d.limit)} MB</span></h4>
      <div class="usage ${pct > 90 ? 'high' : pct > 70 ? 'mid' : ''}"><div style="width:${pct.toFixed(1)}%"></div></div>
      <p class="note">Above ${mb(d.limit)} MB, photos of the oldest closed tickets are removed automatically until it is back under ${mb(d.limit) - 50} MB. Open tickets are never touched.</p>`;
  }).catch(() => { const b = $('#usage-box'); if (b) b.innerHTML = '<h4>Photo storage</h4><p class="note">Not available yet. Run the update-2 SQL in Supabase to turn this on.</p>'; });
  const patch = async (id, body) => { try { await api('/api/users/' + id, { method: 'PATCH', body }); toast('Saved'); renderUsers(); } catch (e) { toast(e.message, true); } };
  document.querySelectorAll('[data-approve]').forEach((b) => b.onclick = () => patch(b.dataset.approve, { status: 'active' }));
  document.querySelectorAll('[data-reject]').forEach((b) => b.onclick = () => patch(b.dataset.reject, { status: 'disabled' }));
  document.querySelectorAll('[data-role]').forEach((s) => s.onchange = () => {
    const u = users.find((x) => x.id == s.dataset.role);
    if (s.value === '__pw') { s.value = u.role; passwordSheet('Reset password', `Set a new password for ${u.name} (@${u.username}). Tell them the new password.`, (pw) => api('/api/users/' + u.id + '/password', { method: 'POST', body: { password: pw } })); return; }
    if (s.value === '__disable') patch(u.id, { status: u.status === 'disabled' ? 'active' : 'disabled' });
    else patch(u.id, { role: s.value });
  });
}

boot();
